name: CI Security Pipeline

permissions:
  contents: read
  security-events: write

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  sca-npm-audit:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci --omit=dev

      - name: npm audit (fail on high/critical)
        run: |
          npm audit --audit-level=high

  sast-semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (OWASP Top 10)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten
          generateSarif: "1"
          sarifFile: semgrep.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: >
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Save SARIF as artifact (fallback for forked PRs)
        if: >
          !(github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  dast-zap:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          nohup npm start >/dev/null 2>&1 &
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/ >/dev/null; then
              echo "App is up"
              break
            fi
            sleep 1
          done

      - name: ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            --network=host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -m 3 -a -l INFO

      - name: Fail if High alerts found
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          COUNT=$(jq '[.site[]?.alerts[]? | select((.riskcode|tonumber) >= 3)] | length' report_json.json || echo 0)
          echo "High-risk alerts: $COUNT"
          test "$COUNT" -eq 0

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_html.html
            report_md.md
            report_json.json

      - name: Stop app
        if: always()
        run: |
          pkill -f "node dist/server.js" || true